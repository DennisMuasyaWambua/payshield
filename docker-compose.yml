version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: payshield_postgres
    environment:
      POSTGRES_DB: payshield
      POSTGRES_USER: payshield_user
      POSTGRES_PASSWORD: payshield_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payshield_user -d payshield"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: payshield_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # FastAPI Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: payshield_backend
    environment:
      - ENVIRONMENT=production
      - DATABASE_URL=postgresql://payshield_user:payshield_password@postgres:5432/payshield
      - REDIS_URL=redis://redis:6379
      - API_SECRET_KEY=${API_SECRET_KEY}
      - JWT_SECRET=${JWT_SECRET}
      - BASE_RPC_URL=${BASE_RPC_URL}
      - PRIVATE_KEY=${PRIVATE_KEY}
      - PAYWALL_CORE_ADDRESS=${PAYWALL_CORE_ADDRESS}
      - PAYWALL_SUBSCRIPTIONS_ADDRESS=${PAYWALL_SUBSCRIPTIONS_ADDRESS}
      - PAYWALL_REGISTRY_ADDRESS=${PAYWALL_REGISTRY_ADDRESS}
      - DEVICE_ACCESS_MANAGER_ADDRESS=${DEVICE_ACCESS_MANAGER_ADDRESS}
      - USDC_ADDRESS=${USDC_ADDRESS}
      - ELEMENT_PAY_API_KEY=${ELEMENT_PAY_API_KEY}
      - ELEMENT_PAY_API_SECRET=${ELEMENT_PAY_API_SECRET}
      - ELEMENT_PAY_WEBHOOK_SECRET=${ELEMENT_PAY_WEBHOOK_SECRET}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend/uploads:/app/uploads
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  # Next.js Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:8000}
        - NEXT_PUBLIC_WALLETCONNECT_PROJECT_ID=${NEXT_PUBLIC_WALLETCONNECT_PROJECT_ID}
        - NEXT_PUBLIC_BASE_CHAIN_ID=${NEXT_PUBLIC_BASE_CHAIN_ID:-8453}
        - NEXT_PUBLIC_USDC_ADDRESS=${USDC_ADDRESS}
        - NEXT_PUBLIC_PAYWALL_CORE_ADDRESS=${PAYWALL_CORE_ADDRESS}
    container_name: payshield_frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped

  # Nginx Load Balancer
  nginx:
    image: nginx:alpine
    container_name: payshield_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
      - ./ssl:/etc/nginx/ssl
    depends_on:
      - frontend
      - backend
    restart: unless-stopped

  # Monitoring - Prometheus
  prometheus:
    image: prom/prometheus:latest
    container_name: payshield_prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=200h'
      - '--web.enable-lifecycle'
    restart: unless-stopped

  # Monitoring - Grafana
  grafana:
    image: grafana/grafana:latest
    container_name: payshield_grafana
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  prometheus_data:
  grafana_data:

networks:
  default:
    name: payshield_network